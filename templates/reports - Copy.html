<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <style>

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-top:40px;
        }

        .card{
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            text-align:center;
        }

        .card h2{
            color:#555;
        }

        .card h3{
            color:#2e8b57;
            font-size:28px;
        }

    </style>

</head>

<body>

<h1>📊 Financial Report</h1>

<div class="cards">

    <div class="card">
        <h2>Total Income</h2>
        <h3>₹ {{ income }}</h3>
    </div>

    <div class="card">
        <h2>Total Expense</h2>
        <h3>₹ {{ expense }}</h3>
    </div>

    <div class="card">
        <h2>Balance</h2>
        <h3>₹ {{ balance }}</h3>
    </div>

    <div class="card">
        <h2>Savings</h2>
        <h3>₹ {{ savings }}</h3>
    </div>

</div>

</body>

</html>
