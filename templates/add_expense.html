<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Expense - Expense Tracker</title>

    <!-- Add Expense CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/add_expense.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =====================================================
     BACKGROUND GREEN TEXTURE
===================================================== -->

<div class="expense-texture texture-top-left">

    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>


<div class="expense-texture texture-bottom-right">

    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>



<!-- =====================================================
     BRAND
===================================================== -->

<div class="brand">

    <div class="brand-icon">

        <i class="fas fa-wallet"></i>

    </div>

    <span>Expense Tracker</span>

</div>



<!-- =====================================================
     ADD EXPENSE PAGE
===================================================== -->

<div class="expense-page">


    <!-- =================================================
         GLASS CARD
    ================================================== -->

    <div class="expense-box">


        <!-- Header -->

        <div class="expense-header">

            <div class="expense-icon">

                <i class="fas fa-receipt"></i>

            </div>

            <h1>Add Expense</h1>

            <p>
                Record your spending and keep your finances organized.
            </p>

        </div>



        <!-- =================================================
             EXPENSE FORM
        ================================================== -->

        <form action="/save_expense"
              method="POST">


            <!-- Expense Title -->

            <div class="form-group">

                <label>Expense Title</label>

                <div class="input-box">

                    <i class="fas fa-pen"></i>

                    <input
                        type="text"
                        name="title"
                        placeholder="Enter expense title"
                        required>

                </div>

            </div>



            <!-- Category -->

            <div class="form-group">

                <label>Category</label>

                <div class="input-box">

                    <i class="fas fa-layer-group"></i>

                    <select
                        name="category"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Medical">
                            Medical
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>



            <!-- Amount -->

            <div class="form-group">

                <label>Amount</label>

                <div class="input-box">

                    <i class="fas fa-indian-rupee-sign"></i>

                    <input
                        type="number"
                        name="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required>

                </div>

            </div>



            <!-- Date -->

            <div class="form-group">

                <label>Date</label>

                <div class="input-box">

                    <i class="fas fa-calendar-days"></i>

                    <input
                        type="date"
                        name="date"
                        required>

                </div>

            </div>



            <!-- Description -->

            <div class="form-group">

                <label>Description</label>

                <div class="input-box textarea-box">

                    <i class="fas fa-align-left"></i>

                    <textarea
                        name="description"
                        rows="4"
                        placeholder="Enter description (optional)"></textarea>

                </div>

            </div>



            <!-- =================================================
                 BUTTONS
            ================================================== -->

            <div class="form-actions">


                <!-- Save Expense -->

                <button
                    type="submit"
                    class="save-btn">

                    <i class="fas fa-plus"></i>

                    <span>Save Expense</span>

                </button>



                <!-- Back Dashboard -->

                <a href="/dashboard"
                   class="back-btn">

                    <i class="fas fa-arrow-left"></i>

                    <span>Back to Dashboard</span>

                </a>


            </div>


        </form>


    </div>


    <!-- Footer -->

    <p class="footer-text">

        Simple • Secure • Smart expense management

    </p>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="{{ url_for('static', filename='js/add_expense.js') }}"></script>


</body>

</html>
