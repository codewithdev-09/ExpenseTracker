<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <!-- Edit Expense CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_expense.css') }}">

</head>


<body>


<div class="expense-container">


    <h1>✏️ Edit Expense</h1>


    <form method="POST">


        <!-- Title -->

        <input 
        type="text"
        name="title"
        value="{{ expense[1] }}"
        placeholder="Expense Title"
        required>



        <!-- Category -->

        <select name="category" required>

            <option value="{{ expense[2] }}">
                {{ expense[2] }}
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Travel">
                Travel
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Education">
                Education
            </option>

            <option value="Entertainment">
                Entertainment
            </option>

            <option value="Other">
                Other
            </option>

        </select>




        <!-- Amount -->

        <input
        type="number"
        name="amount"
        value="{{ expense[3] }}"
        placeholder="Amount"
        required>




        <!-- Date -->

        <input
        type="date"
        name="date"
        value="{{ expense[4] }}"
        required>




        <!-- Description -->

        <textarea
        name="description"
        placeholder="Description">{{ expense[5] }}</textarea>





        <!-- Save Button -->

        <button type="submit">

            💾 Save Changes

        </button>


    </form>



    <a href="{{ url_for('expense_history') }}">

        ⬅ Back to Expenses

    </a>



</div>



</body>

</html>
